    bio: >-
      Licenciada en Psicología por excelencia de la Universidad Mayor de San Simón. Psicóloga
      clínica y psicoterapeuta especializada en TCC. Cuenta con formación avanzada en TREC, DBT,
      EP, EPR y Mindfulness, además de experiencia en la intervención de trastornos de ansiedad,
      TOC, trauma, depresión, TEPT y TLP. Es directora del Centro de Terapia Cognitivo Conductual
      KAIROS, fundadora de TOC Bolivia, coordinadora de grupo de habilidades para personas con
      TLP y fundadora de la Red de Adopción Bolivia. Se desempeña también en la docencia
      universitaria de pre y posgrado y en supervisión.
