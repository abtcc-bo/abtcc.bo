    bio: >-
      Psicóloga clínica y psicoterapeuta especializada en terapia cognitivo-conductual. Tiene
      experiencia en el tratamiento de trastornos de ansiedad, TOC, trauma, depresión, TEPT y
      trastorno límite de la personalidad, y se desempeña en la docencia universitaria de pregrado
      y posgrado y en supervisión clínica. Es directora del Centro de Terapia Cognitivo Conductual
      KAIROS, fundadora de TOC Bolivia y de la Red de Adopción Bolivia, y coordina un grupo de
      habilidades para personas con TLP.
    formacion:
      - "Maestría — [PENDIENTE: nombre, universidad y país]"
      - Licenciatura en Psicología (por excelencia) — Universidad Mayor de San Simón (Bolivia)
      - Formación avanzada en TREC, DBT, exposición prolongada, exposición con prevención de respuesta y mindfulness
    areas:
      - Ansiedad y TOC
      - Trauma y TEPT
      - Depresión
      - Trastorno límite de la personalidad
      - Supervisión clínica
