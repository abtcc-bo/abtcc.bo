textos:
  es:
    cargo: Presidente
    bio: >-
      Médico psiquiatra y doctor en Salud Mental Comunitaria, con formación de posgrado en
      psicoterapia cognitiva y cognitivo-conductual, psicofarmacología clínica y neurociencias.
      Docente e investigador con amplia trayectoria en la formación de profesionales de salud
      mental en Bolivia y Latinoamérica, trabaja en psicopatología, psicofarmacología,
      intervenciones psicoterapéuticas basadas en evidencia y salud mental comunitaria. Es
      coordinador de Salud Mental del Hospital Universitario Japonés de Santa Cruz de la Sierra,
      docente investigador de la UPSA, director de la Revista Boliviana de Psiquiatría y
      Académico de Número de la Academia Nacional de Ciencias de Bolivia.
    formacion:
      - Doctorado en Salud Mental Comunitaria — Universidad Nacional de Lanús (Argentina)
      - Estancia posdoctoral de investigación (Research Fellowship) — Universidad de Melbourne (Australia)
      - Máster en Políticas y Servicios de Salud Mental — Universidade Nova de Lisboa (Portugal)
