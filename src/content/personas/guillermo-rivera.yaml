textos:
  es:
    cargo: Coordinador
    bio: >-
      Médico psiquiatra, psicoterapeuta, docente e investigador, con más de veinte años de
      experiencia clínica y académica. Es Coordinador de la ABTCC, Jefe del Servicio de
      Psiquiatría y Psicología del Hospital Universitario Japonés, Director de la Revista
      Boliviana de Psiquiatría y Académico de Número de la Academia Nacional de Ciencias de
      Bolivia. Su trabajo integra psicoterapia, psicofarmacología, docencia e investigación.
