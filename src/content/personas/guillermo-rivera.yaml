  es:
    cargo: Coordinador
    bio: >-
      Médico psiquiatra y psicoterapeuta, con más de veinte años de experiencia clínica y
      académica. Su trabajo integra la psicoterapia, la psicofarmacología, la docencia y la
      investigación. Es Coordinador de la ABTCC, Jefe del Servicio de Psiquiatría y Psicología
      del Hospital Universitario Japonés, Director de la Revista Boliviana de Psiquiatría y
      Académico de Número de la Academia Nacional de Ciencias de Bolivia.
