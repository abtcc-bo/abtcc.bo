textos:
  es:
    cargo: Marketing y Publicidad
    bio: >-
      Psicólogo y psicoterapeuta conductual-contextual, formado en análisis funcional del
      comportamiento, terapia dialéctico conductual (DBT), terapia de aceptación y compromiso (ACT)
      y psicoterapia analítico funcional (FAP). Ha sido psicólogo clínico en el Hospital de
      Clínicas, en Aldeas Infantiles SOS y en el consultorio psicológico de la Universidad Católica
      Boliviana, donde también fue supervisor académico. Es docente de posgrado en la Universidad
      Católica Boliviana, la UAGRM e ITACA Formaciones, socio fundador de la ABTCC y divulgador de
      Psicología Contextual en redes sociales.
    formacion:
      - Máster en Análisis Funcional del Comportamiento — SAVECC (España)
      - Diplomado en Terapias Conductuales Contextuales (DBT, ACT y FAP) — Fundación CIPCO (Argentina)
      - Especialidad en Psicología Clínica Sistémica y Terapias Breves — Universidad Católica Boliviana "San Pablo" (Bolivia)
      - Licenciatura en Psicología — Universidad Católica Boliviana "San Pablo" (Bolivia)
    areas:
      - Psicoterapia conductual-contextual
      - Análisis funcional
      - DBT y ACT
      - Formación y supervisión clínica
      - Divulgación científica
