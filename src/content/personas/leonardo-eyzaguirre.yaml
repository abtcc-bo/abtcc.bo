    bio: >-
      Psicólogo y psicoterapeuta especialista en psicoterapia conductual-contextual, con
      experiencia en práctica clínica, docencia y divulgación. Licenciado en Psicología por la
      Universidad Católica Boliviana "San Pablo", con una especialización en Psicología Clínica
      Sistémica y Terapias Breves, Especialista en Psicoterapias Conductuales y Contextuales por
      CIPCO y Máster en Análisis Funcional del Comportamiento por SAVECC. Se desempeña como
      docente y supervisor en formación clínica contextual y es divulgador de Psicología
      Contextual en redes sociales.
