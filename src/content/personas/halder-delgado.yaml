nombre: Halder Delgado
titulo_profesional: MSc. · Psicólogo clínico
comision: true
orden: 3
foto: ./fotos/halder-delgado.webp
textos:
  es:
    cargo: Secretaría Académica
    bio: >-
      Psicólogo clínico y psicoterapeuta especializado en terapias conductuales y contextuales y en
      psicoterapias basadas en evidencia. Tiene más de seis años de práctica clínica con jóvenes y
      adultos en Santa Cruz de la Sierra y más de cinco como docente de posgrado en instituciones
      públicas y privadas de Bolivia y México. Es Director General del Instituto PSITEC y coordina el
      diseño curricular de la Maestría en Terapia Cognitivo-Conductual de la UAGRM, donde enseña
      tecnología conductual y supervisión clínica de casos.
    formacion:
      - Máster en Terapias Conductuales y Contextuales Infanto-Juveniles y Adultos — ITECOC (México)
      - Maestría en Psicología Clínica (tesis en curso) — Universidad Andina Simón Bolívar (Bolivia)
      - Diplomado en Docencia para Educación Superior — Universidad San Francisco Xavier de Chuquisaca (Bolivia)
      - Licenciatura en Psicología — Universidad Autónoma Gabriel René Moreno (Bolivia)
    areas:
      - Terapias conductuales y contextuales
      - Análisis funcional de la conducta
      - Terapia dialéctico conductual (DBT)
      - Docencia y supervisión clínica
      - Diseño de programas de formación
