  es:
    cargo: "[PENDIENTE: cargo]"
    bio: >-
      Psicólogo clínico y psicoterapeuta con siete años de experiencia en práctica privada.
      Docente de posgrado en instituciones de Bolivia y México, destaca por su labor formativa y
      su aporte al desarrollo académico. Actualmente es Director General del Instituto de
      Psicología y Terapias Conductuales y diseñador del Programa de Maestría en Terapia
      Cognitivo-Conductual y Contextual de la UAGRM, impulsando la psicología basada en
      evidencia en Bolivia.
