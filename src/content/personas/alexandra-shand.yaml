textos:
  es:
    cargo: "[PENDIENTE: cargo]"
    bio: >-
      Licenciada en Fonoaudiología, con maestrías en Salud Pública y Psicología. Especializada
      en Terapia Dialéctico Conductual (DBT), cuenta con formación avanzada en DBT Next Steps y
      DBT-Sleep. Su trayectoria integra una perspectiva interdisciplinaria y contextual de la
      salud mental, con énfasis en desregulación emocional, trauma complejo, conducta suicida y
      trastornos de personalidad. Es autora de un curso práctico de habilidades DBT para
      familiares y pionera en Latinoamérica en la adaptación e implementación de DBT Next Steps,
      además de docente y formadora.
