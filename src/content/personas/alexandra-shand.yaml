textos:
  es:
    cargo: "[PENDIENTE: cargo]"
    bio: >-
      Licenciada en Fonoaudiología, con maestrías en Psicología y en Salud Pública, especializada
      en Terapia Dialéctico Conductual (DBT). Trabaja desde un marco DBT informado por trauma, con
      énfasis en la desregulación emocional, el trauma complejo, la conducta suicida y los
      trastornos de personalidad. Es autora de «Terapia Dialéctico Conductual: un curso de 25
      habilidades prácticas para familiares», pionera en Latinoamérica en la adaptación e
      implementación de DBT Next Steps, docente y formadora, y miembro fundadora de la ABTCC.
    formacion:
      - MSc. en Psicología (con distinción) — Northumbria University (Inglaterra)
      - Maestría en Salud Pública — Universidad Autónoma Tomás Frías (Bolivia)
      - Licenciatura en Fonoaudiología — Manchester Polytechnic, hoy Manchester Metropolitan University (Inglaterra)
      - Certificación en Terapia Dialéctica Conductual — Behavioral Tech
    areas:
      - Terapia dialéctico conductual (DBT)
      - Desregulación emocional
      - Trauma complejo
      - Conducta suicida
      - Trastornos de personalidad
