# XI SIALAPCCO Bolivia (Simposio Internacional ALAPCCO–ABTCC 2027): PÁGINA COMPLETA, EN PREPARACIÓN
# (no se publica mientras diga `borrador: true`).
# Lo que hoy ve el público es el anuncio corto de la carpeta 2027-03-01-xi-sialapcco-bolivia ("marzo de 2027").
#
# Para publicarla (según el plan operativo, el 15 de diciembre de 2026, junto con la apertura de inscripciones):
