#   2. Cambiar el nombre de esta carpeta a 2027-03-12-xi-sialapcco-bolivia (así conserva la misma dirección).
#   3. Quitar la línea `borrador: true`.
#   4. Agregar `inscripcion: { url: ... }` con el enlace del formulario (con eso los botones dicen "Inscribirme").
